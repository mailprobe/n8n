# One grouped pull request per ecosystem, security fixes grouped too. Dependabot
# only opens pull requests: merging stays manual and releases stay manual
# (tags or workflow_dispatch). The cooldown keeps versions younger than three
# days out, like pnpm's minimumReleaseAge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    # TypeScript 6 and 7 wait: typescript-eslint supports TypeScript <6.1 only,
    # and the n8n-node tsconfig template still uses moduleResolution "node".
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
